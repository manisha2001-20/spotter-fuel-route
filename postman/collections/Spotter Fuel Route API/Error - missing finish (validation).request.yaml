$kind: http-request
url: "{{baseUrl}}/api/route/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "start": "Chicago, IL"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
      pm.test('error code invalid_request', () => pm.expect(pm.response.json().error.code).to.eql('invalid_request'));
    language: text/javascript
order: 8000

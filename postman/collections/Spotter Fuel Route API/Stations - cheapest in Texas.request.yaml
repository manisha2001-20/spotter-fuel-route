$kind: http-request
url: "{{baseUrl}}/api/stations/?state=TX&limit=10"
method: GET
queryParams:
  state: TX
  limit: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('sorted by price', () => { const p = pm.response.json().results.map(s => s.retail_price);
        pm.expect(p).to.eql([...p].sort((a, b) => a - b)); });
    language: text/javascript
order: 2000

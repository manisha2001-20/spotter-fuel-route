<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fuel Route Planner</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root { --bg:#f6f7f9; --panel:#fff; --text:#1d2330; --muted:#5d6675; --accent:#0b6bcb; --border:#dde1e7; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
    .layout { display:grid; grid-template-columns: 380px 1fr; height:100vh; }
    aside { background:var(--panel); border-right:1px solid var(--border); padding:16px; overflow-y:auto; }
    h1 { font-size:18px; margin:0 0 4px; }
    p.sub { margin:0 0 16px; color:var(--muted); font-size:13px; }
    label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
    input { width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px; font-size:14px; }
    button { margin-top:12px; width:100%; padding:10px; border:0; border-radius:6px; background:var(--accent); color:#fff; font-size:14px; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    .summary { margin-top:16px; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .tile { border:1px solid var(--border); border-radius:6px; padding:8px; }
    .tile b { display:block; font-size:16px; font-variant-numeric: tabular-nums; }
    .tile span { font-size:11px; color:var(--muted); }
    ol { padding-left:18px; font-size:13px; }
    ol li { margin-bottom:8px; }
    .err { color:#b42318; font-size:13px; margin-top:12px; }
    .meta { color:var(--muted); font-size:11px; margin-top:12px; }
    #map { height:100vh; }
    @media (max-width: 800px) { .layout { grid-template-columns:1fr; height:auto; } #map { height:60vh; } }
  </style>
</head>
<body>
<div class="layout">
  <aside>
    <h1>Fuel Route Planner</h1>
    <p class="sub">Cheapest fuel stops for a 500-mile-range vehicle at 10 mpg. Uses <code>/api/route/</code>.</p>
    <form id="f">
      <label for="start">Start (US place or "lat,lon")</label>
      <input id="start" value="New York, NY" required maxlength="200">
      <label for="finish">Finish</label>
      <input id="finish" value="Los Angeles, CA" required maxlength="200">
      <label for="fuel">Fuel in tank at start (gallons, 0-50)</label>
      <input id="fuel" type="number" min="0" max="50" step="any" value="0">
      <button id="go">Plan route</button>
    </form>
    <div id="out"></div>
  </aside>
  <div id="map"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map').setView([39.5, -98.35], 4);
  // OpenStreetMap tile usage policy (operations.osmfoundation.org/policies/tiles):
  // use exactly this URL, and send a Referer. Django's default page header
  // "Referrer-Policy: same-origin" strips the Referer from cross-site requests,
  // and OSM answers those tiles with "403 Access blocked", so tile requests
  // opt back in to sending the page origin.
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    referrerPolicy: 'strict-origin-when-cross-origin',
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'
  }).addTo(map);
  let layer = null;
  const out = document.getElementById('out');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money = n => '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});

  // Allow shareable links: /?start=Dallas,TX&finish=Houston,TX plans immediately.
  const qs = new URLSearchParams(location.search);
  if (qs.get('start') && qs.get('finish')) {
    document.getElementById('start').value = qs.get('start');
    document.getElementById('finish').value = qs.get('finish');
    if (qs.get('fuel')) document.getElementById('fuel').value = qs.get('fuel');
    window.addEventListener('load', () => document.getElementById('f').requestSubmit());
  }

  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('go');
    btn.disabled = true; btn.textContent = 'Planning...'; out.innerHTML = '';
    try {
      const res = await fetch('/api/route/', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          start: document.getElementById('start').value,
          finish: document.getElementById('finish').value,
          initial_fuel_gallons: Number(document.getElementById('fuel').value || 0)
        })
      });
      const data = await res.json();
      if (!res.ok) { out.innerHTML = `<div class="err">${esc(data.error?.message || 'Request failed')}</div>`; return; }
      render(data);
    } catch (err) {
      out.innerHTML = `<div class="err">${esc(err.message)}</div>`;
    } finally { btn.disabled = false; btn.textContent = 'Plan route'; }
  });

  function render(d) {
    if (layer) layer.remove();
    layer = L.geoJSON(d.map, {
      style: f => f.geometry.type === 'LineString' ? { color: '#0b6bcb', weight: 4 } : {},
      pointToLayer: (f, latlng) => {
        const k = f.properties.kind;
        const color = k === 'fuel_stop' ? '#d92d20' : (k === 'start' ? '#12b76a' : '#1d2330');
        return L.circleMarker(latlng, { radius: k === 'fuel_stop' ? 7 : 8, color: '#fff', weight: 2, fillColor: color, fillOpacity: 1 });
      },
      onEachFeature: (f, l) => {
        const p = f.properties;
        if (p.kind === 'fuel_stop') l.bindPopup(`<b>Stop ${p.stop_number}: ${esc(p.name)}</b><br>Mile ${p.mile_marker}<br>$${p.price_per_gallon}/gal &times; ${p.gallons_purchased} gal = ${money(p.cost)}`);
        else if (p.label) l.bindPopup(esc(p.label));
      }
    }).addTo(map);
    map.fitBounds(layer.getBounds(), { padding: [20, 20] });

    const s = d.summary;
    out.innerHTML = `
      <div class="summary">
        <div class="tile"><b>${money(s.total_fuel_cost)}</b><span>total fuel cost</span></div>
        <div class="tile"><b>${d.route.distance_miles} mi</b><span>route distance</span></div>
        <div class="tile"><b>${s.number_of_stops}</b><span>fuel stops</span></div>
        <div class="tile"><b>${s.total_gallons_purchased} gal</b><span>fuel purchased</span></div>
      </div>
      <ol>${d.fuel_stops.map(st => `<li><b>${esc(st.station.name)}</b>, ${esc(st.station.city)}, ${esc(st.station.state)}<br>
        mile ${st.mile_marker} &middot; $${st.price_per_gallon}/gal &middot; ${st.gallons_purchased} gal &middot; ${money(st.cost)}</li>`).join('')}</ol>
      <div class="meta">External API calls: ${d.meta.external_api_calls.total} &middot; total ${d.meta.timing_ms.total} ms</div>`;
  }
</script>
</body>
</html>

$kind: http-request
url: "{{baseUrl}}/api/health/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('stations loaded', () => pm.expect(pm.response.json().stations.routable).to.be.above(0));
    language: text/javascript
order: 1000

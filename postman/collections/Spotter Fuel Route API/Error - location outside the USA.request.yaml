$kind: http-request
url: "{{baseUrl}}/api/route/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "start": "Toronto, Canada",
      "finish": "Chicago, IL"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 422', () => pm.response.to.have.status(422));
      pm.test('error code location_outside_usa', () => pm.expect(pm.response.json().error.code).to.eql('location_outside_usa'));
    language: text/javascript
order: 7000
